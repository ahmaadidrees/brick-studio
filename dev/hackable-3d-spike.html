<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackable 3D spike</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; }
      canvas { display: block; touch-action: none; }
      #hud { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: rgb(255 255 255 / 0.85); border-radius: 10px;

      #help { position: fixed; left: 12px; bottom: 12px; font: 13px/1.4 system-ui, sans-serif; color: #1d2b36; background: rgb(255 255 255 / 0.85); padding: 8px 12px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="help">Dev only. Arrows or WASD move, Space jumps, X runs, drag to turn the camera. ?bricks=500 · ?lag=4</div>
    <script type="module" src="/src/platformer/lab/kit3d/spike/main.ts"></script>
  </body>
</html>
