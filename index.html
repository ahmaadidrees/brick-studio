<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9fbff" />
    <meta name="description" content="Build a brick world, then enter it and explore." />
    <title>Brick Studio</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (LinkedIn, Slack, iMessage, X). Vite replaces the VITE_PUBLIC_ORIGIN
         placeholder at build time with the origin from .env.production, so the URLs are absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brick Studio" />
    <meta property="og:description" content="Build a brick world in your browser, then step inside and explore it — on your own or together." />
    <meta property="og:url" content="%VITE_PUBLIC_ORIGIN%/" />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An isometric toy-brick diorama: a small building, a tower with a flag, and a block explorer on a studded baseplate." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brick Studio" />
    <meta name="twitter:description" content="Build a brick world in your browser, then step inside and explore it — on your own or together." />
    <meta name="twitter:image" content="%VITE_PUBLIC_ORIGIN%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
